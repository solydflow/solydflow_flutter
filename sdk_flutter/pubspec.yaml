name: solydflow_flutter
description: The revenue infrastructure for African mobile apps. Handle subscriptions, entitlements, and localized payments (Paystack, Flutterwave) with one line of code.
version: 0.5.0
homepage: https://solydflow.com
repository: https://github.com/solydflow/solydflow_flutter
issue_tracker: https://github.com/solydflow/solydflow_flutter/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.0.0
  webview_flutter: ^4.2.0
  uuid: ^4.0.0
  # Add other dependencies like encryption libs here later
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^6.0.0 # To check Wifi vs Data
  device_info_plus: ^10.0.0  # To get OS/Model
  battery_plus: ^6.0.0      # To get Battery %

  in_app_purchase: ^3.2.0
  io: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

